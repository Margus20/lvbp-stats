name: Actualizar Estadísticas LVBP

on:
  schedule:
    # Se ejecuta todos los días a las 8:00 AM UTC (4:00 AM en Venezuela)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write # ESTO ES CRÍTICO - Permite modificar archivos

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar Chrome y ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium chromium-driver
          
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 selenium
        
      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Ejecutar Script de Estadísticas
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python actualizar_lideres.py
