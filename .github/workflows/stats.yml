name: Actualizar Estadísticas LVBP

on:
  schedule:
    # Se ejecuta todos los días a las 8:00 AM UTC (4:00 AM en Venezuela)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write # Permite modificar archivos

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # 🏆 ESTE ES EL SECRETO: Instala Chrome de forma portable y sin errores de Ubuntu
      - name: Configurar Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          
      - name: Instalar dependencias de Python
        run: pip install requests beautifulsoup4 selenium
        
      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Ejecutar Script de Estadísticas
        env:
          # Usamos GITHUB_TOKEN que ya viene integrado y tiene permisos de escritura
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python actualizar_lideres.py
