name: Actualizar Resultados LVBP

on:
  schedule:
    # Lunes a Domingo - Cada 30 minutos durante horarios de juego (6 PM - 11 PM Venezuela)
    # Esto equivale a 10:30 PM - 3:30 AM UTC (día siguiente)
    - cron: '30 22 * * *'  # 6:30 PM VZLA
    - cron: '00 23 * * *'  # 7:00 PM VZLA
    - cron: '30 23 * * *'  # 7:30 PM VZLA
    - cron: '00 00 * * *'  # 8:00 PM VZLA
    - cron: '30 00 * * *'  # 8:30 PM VZLA
    - cron: '00 01 * * *'  # 9:00 PM VZLA
    - cron: '30 01 * * *'  # 9:30 PM VZLA
    - cron: '00 02 * * *'  # 10:00 PM VZLA
    - cron: '30 02 * * *'  # 10:30 PM VZLA
    - cron: '00 03 * * *'  # 11:00 PM VZLA
    - cron: '00 08 * * *'  # 4:00 AM VZLA (resultados del día anterior)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar Playwright y dependencias
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium
          playwright install-deps chromium
          
      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Ejecutar Bot de Resultados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python actualizar_resultados.py
