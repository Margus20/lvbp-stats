name: Actualizar Estadísticas LVBP

on:
  schedule:
    # Se ejecuta todos los días a las 8:00 AM UTC (que son 4:00 AM en Venezuela)
    - cron: '0 8 * * *'
  workflow_dispatch: # Esto te permite ejecutarlo manualmente cuando quieras

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
        
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4
        
      - name: Ejecutar Script de Estadísticas
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python actualizar_lideres.py
