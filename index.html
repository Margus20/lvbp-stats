<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVBP al Día - Liga Venezolana de Béisbol Profesional</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Margus20/lvbp-stats/main/img/logo_pag.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos CSS (Versión actualizada a 106 para limpiar caché) -->
    <link rel="stylesheet" href="css/01-base.css?v=106">
    <link rel="stylesheet" href="css/02-header-nav.css?v=106">
    <link rel="stylesheet" href="css/03-noticias-articulos.css?v=106">
    <link rel="stylesheet" href="css/04-tablas-posiciones.css?v=106">
    <link rel="stylesheet" href="css/05-tarjetas-juegos.css?v=106">
    <link rel="stylesheet" href="css/06-estadisticas-mascotas.css?v=106">
    <link rel="stylesheet" href="css/07-sidebar-footer.css?v=106">
    <link rel="stylesheet" href="css/08-boton-flotante.css?v=106">
    
    <!-- Iconos de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Analítica -->
    <script data-goatcounter="https://margus20.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
    <!-- AQUÍ SE CARGARÁ EL HEADER DESDE componentes/header.html -->
    <div id="header-placeholder"></div>

    <div class="main-layout">
        <main class="contenido-principal">
            
            <!-- ========================================== -->
            <!-- HERO DE NOTICIA PRINCIPAL (DINÁMICO) -->
            <!-- ========================================== -->
            <section class="hero-noticia" id="hero-noticia-container">
                <!-- El contenido se llenará automáticamente con la noticia principal del día -->
            </section>

            <!-- ========================================== -->
            <!-- SECCIÓN DE NOTICIAS SECUNDARIAS (4 PEQUEÑAS) -->
            <!-- ========================================== -->
            <section class="noticias-grid-section" id="seccion-noticias">
                <div class="container">
                    <h2 class="titulo-seccion">
                        <img src="https://raw.githubusercontent.com/Margus20/lvbp-stats/main/img/lvbp.png" alt="LVBP" class="logo-seccion">
                        Más Noticias
                    </h2>
                    
                    <!-- Noticias Secundarias (PEQUEÑAS en grid) -->
                    <div id="noticias-secundarias-container" class="grid-noticias"></div>
                </div>
            </section>

            <section class="articulo-completo" id="articulo-completo" style="display: none;">
                <div class="container">
                    <button class="btn-volver" onclick="window.cerrarArticulo()">← Volver a noticias</button>
                    <article class="articulo-contenido" id="articulo-contenido"></article>
                    <div class="marca-final-articulo">
                        <img src="https://raw.githubusercontent.com/Margus20/lvbp-stats/main/img/logo_pag.png" alt="LVBP al Día" class="logo-marca-final">
                        <p class="texto-marca-final">LVBP al Día - Tu fuente de béisbol venezolano</p>
                    </div>
                    <div class="seccion-comentarios">
                        <h3>💬 Comentarios</h3>
                        <form class="formulario-comentario" id="formulario-comentario">
                            <input type="text" placeholder="Tu nombre" required class="input-comentario">
                            <textarea placeholder="Escribe tu comentario..." required class="textarea-comentario" rows="4"></textarea>
                            <button type="submit" class="btn-comentar">Publicar comentario</button>
                        </form>
                        <div class="lista-comentarios" id="lista-comentarios"></div>
                    </div>
                    <div class="seccion-compartir">
                        <h3>📢 Comparte esta noticia</h3>
                        <div class="botones-compartir">
                            <a href="#" class="btn-compartir whatsapp" onclick="window.compartirEnRed('whatsapp', 'noticia'); return false;"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                            <a href="#" class="btn-compartir telegram" onclick="window.compartirEnRed('telegram', 'noticia'); return false;"><i class="fab fa-telegram"></i> Telegram</a>
                            <a href="#" class="btn-compartir facebook" onclick="window.compartirEnRed('facebook', 'noticia'); return false;"><i class="fab fa-facebook"></i> Facebook</a>
                            <a href="#" class="btn-compartir twitter" onclick="window.compartirEnRed('twitter', 'noticia'); return false;"><img src="https://raw.githubusercontent.com/Margus20/lvbp-stats/main/img/xapp.png" alt="X" class="logo-x-btn"> X</a>
                        </div>
                    </div>
                </div>
            </section>

            <section id="posiciones" class="seccion-oscura">
                <div class="container">
                    <h2 class="titulo-seccion"><img src="https://raw.githubusercontent.com/Margus20/lvbp-stats/main/img/lvbp.png" alt="LVBP" class="logo-seccion"> Tabla de Posiciones de la LVBP</h2>
                    <div class="tabla-container">
                        <table id="tabla-posiciones">
                            <thead><tr><th>#</th><th>Equipo</th><th>JJ</th><th>JG</th><th>JP</th><th>PCT</th><th>DIF</th><th>RACHA</th></tr></thead>
                            <tbody id="posiciones-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="resultados" class="seccion-clara">
                <div class="container">
                    <h2 class="titulo-seccion"><img src="https://raw.githubusercontent.com/Margus20/lvbp-stats/main/img/lvbp.png" alt="LVBP" class="logo-seccion"> Resultados Recientes</h2>
                    <div class="resultados-grid" id="resultados-container"></div>
                </div>
            </section>

            <section id="calendario" class="seccion-oscura">
                <div class="container">
                    <h2 class="titulo-seccion"><img src="https://raw.githubusercontent.com/Margus20/lvbp-stats/main/img/lvbp.png" alt="LVBP" class="logo-seccion"> Próximos Juegos</h2>
                    <div class="calendario-lista" id="calendario-container"></div>
                </div>
            </section>

            <!-- AQUÍ SE CARGARÁN LAS ESTADÍSTICAS DESDE componentes/estadisticas.html -->
            <div id="estadisticas-placeholder"></div>
        </main>

        <aside class="sidebar-publicidad" id="sidebar-publicidad"></aside>
    </div>

    <!-- AQUÍ SE CARGARÁ EL FOOTER DESDE componentes/footer.html -->
    <div id="footer-placeholder"></div>

    <!-- Script que carga los componentes y luego la lógica principal -->
    <script>
        async function cargarComponentes() {
            try {
                const header = await fetch('componentes/header.html').then(r => r.text());
                document.getElementById('header-placeholder').innerHTML = header;
                
                const estadisticas = await fetch('componentes/estadisticas.html').then(r => r.text());
                document.getElementById('estadisticas-placeholder').innerHTML = estadisticas;
                
                const footer = await fetch('componentes/footer.html').then(r => r.text());
                document.getElementById('footer-placeholder').innerHTML = footer;
                
                // Cargar app.js (versión 106 para forzar caché nueva y limpia)
                const scriptApp = document.createElement('script');
                scriptApp.type = 'module';
                scriptApp.src = 'js/logica/app.js?v=106';
                document.body.appendChild(scriptApp);

            } catch (error) {
                console.error('Error cargando componentes:', error);
            }
        }
        cargarComponentes();
    </script>
</body>
</html>
